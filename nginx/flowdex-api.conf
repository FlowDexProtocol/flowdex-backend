# ══════════════════════════════════════════════════
# nginx/flowdex-api.conf
# Nginx reverse proxy config for api.flowdexprotocol.com
# 🔴 Replace the domain with your actual domain.
#
# Install:
#   sudo cp nginx/flowdex-api.conf /etc/nginx/sites-available/flowdex-api
#   sudo ln -s /etc/nginx/sites-available/flowdex-api /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ══════════════════════════════════════════════════

server {
    listen 80;
    # 🔴 INSERT YOUR API SUBDOMAIN
    server_name 🔴_api.flowdexprotocol.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Max upload size (for future file uploads)
        client_max_body_size 10M;
    }
}
